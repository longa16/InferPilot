<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#195443">
  <title>NovaMaison · Votre assistant</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #183e34; background: #eef3ee; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100dvh; padding: 28px 20px; }
    button, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .5; }
    button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #bc8c44; outline-offset: 4px; }
    .shell { max-width: 920px; margin: auto; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 6px 22px; }
    .wordmark { font-size: 17px; letter-spacing: .13em; font-weight: 750; }
    .wordmark span { font-weight: 400; }
    .demo { border: 1px solid #c8d6cb; border-radius: 20px; padding: 5px 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .chat { display: flex; flex-direction: column; height: min(780px, calc(100dvh - 145px)); min-height: 420px; border: 1px solid #d7e1d8; border-radius: 24px; overflow: hidden; background: #fff; box-shadow: 0 18px 60px #183e3409; }
    .chat-header { display: flex; align-items: center; gap: 13px; padding: 20px 24px; border-bottom: 1px solid #e8ede8; }
    .avatar { display: grid; place-items: center; flex: 0 0 38px; height: 38px; border-radius: 13px; background: #e6eee7; color: #195443; }
    .chat-header .avatar { background: #195443; color: #fff; }
    h1 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
    .subtitle { margin: 0; font-size: 12px; color: #657c70; }
    .reset { margin-left: auto; background: transparent; border: 1px solid #dbe4dc; border-radius: 9px; color: #526d5f; padding: 9px 12px; font-size: 12px; }
    .messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 28px 24px; scrollbar-width: thin; }
    .message { display: flex; align-items: flex-end; gap: 10px; margin: 0 0 22px; }
    .message.user { justify-content: flex-end; }
    .message-content { max-width: 78%; min-width: 0; }
    .author { display: block; margin: 0 0 7px 3px; font-size: 11px; color: #6d8075; }
    .user .author { text-align: right; margin-right: 3px; }
    .bubble { padding: 14px 17px; border-radius: 17px 17px 17px 4px; background: #f0f4ef; font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user .bubble { border-radius: 17px 17px 4px 17px; background: #195443; color: #fff; }
    .error .bubble { background: #fcf1e9; color: #7a462b; }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 24px 18px; }
    .suggestions button { border: 1px solid #d9e3d9; border-radius: 18px; padding: 8px 12px; background: #fff; color: #476653; font-size: 12px; }
    .suggestions button:hover { background: #eff4ec; }
    .composer-area { padding: 16px 24px 12px; border-top: 1px solid #e8ede8; background: #fff; }
    .composer { display: flex; align-items: flex-end; gap: 12px; padding: 8px 8px 8px 15px; border: 1px solid #ccdace; border-radius: 15px; }
    .composer:focus-within { border-color: #527b62; box-shadow: 0 0 0 3px #1954430a; }
    textarea { display: block; width: 100%; min-height: 42px; max-height: 130px; resize: none; border: 0; outline: 0; background: transparent; padding: 10px 0; line-height: 1.5; font-size: 14px; color: #183e34; }
    textarea:focus-visible { outline: none; }
    textarea::placeholder { color: #829187; }
    .send { flex: 0 0 42px; height: 42px; border: 0; border-radius: 11px; background: #195443; color: #fff; display: grid; place-items: center; }
    .send:hover:not(:disabled) { background: #276a53; }
    .composer-note { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 12px; min-height: 18px; margin-top: 9px; color: #7e8c81; font-size: 10px; }
    .speed-control { display: flex; margin-left: auto; align-items: center; gap: 5px; white-space: nowrap; }
    .speed-control select { border: 0; border-radius: 4px; background: #f0f4ef; color: #526d5f; padding: 2px 4px; font-size: 10px; }
    footer { text-align: center; padding: 16px 15px 0; color: #6c7e70; font-size: 10px; line-height: 1.7; }
    svg { width: 20px; height: 20px; }
    .streaming .bubble::after { content: "▍"; margin-left: 2px; color: #739180; }
    .typing { display: flex; gap: 5px; padding: 8px 0; }
    .typing span { width: 5px; height: 5px; border-radius: 50%; background: #739180; animation: pulse 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes pulse { 0%, 60%, 100% { opacity: .35; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) { .typing span { animation: none; } }
    @media (max-width: 600px) {
      body { padding: 14px 10px; }
      .brand { padding: 0 7px 14px; }
      .wordmark { font-size: 13px; }
      .chat { height: calc(100dvh - 135px); min-height: 350px; border-radius: 18px; }
      .chat-header { padding: 15px 13px; gap: 10px; }
      .reset { font-size: 11px; padding: 8px; }
      .messages { padding: 20px 12px; }
      .message-content { max-width: 85%; }
      .message .avatar { display: none; }
      .bubble { font-size: 13px; padding: 12px 14px; }
      .composer-area { padding: 12px; }
      .suggestions { padding: 0 12px 14px; }
      .keyboard-hint { display: none; }
      .speed-control { display: flex; margin-left: auto; align-items: center; gap: 5px; white-space: nowrap; }
    .speed-control select { border: 0; border-radius: 4px; background: #f0f4ef; color: #526d5f; padding: 2px 4px; font-size: 10px; }
    footer { padding: 12px 4px 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand"><div class="wordmark">NOVA<span>MAISON</span></div><span class="demo">Boutique fictive</span></header>
    <main class="chat" aria-label="Discussion avec NovaMaison">
      <header class="chat-header">
        <div class="avatar" aria-hidden="true">✦</div>
        <div><h1>Votre assistant NovaMaison</h1><p class="subtitle">Produits, livraison et retours</p></div>
        <button class="reset" id="reset" type="button">Nouvelle discussion</button>
      </header>
      <div class="messages" id="messages" role="log" aria-label="Messages de la discussion" aria-live="polite" aria-relevant="additions text"></div>
      <div class="suggestions" id="suggestions" aria-label="Suggestions de questions">
        <button type="button">Comment retourner un article ?</button>
        <button type="button">Quels sont les délais de livraison ?</button>
        <button type="button">Découvrir les produits</button>
      </div>
      <div class="composer-area">
        <form id="form" class="composer">
          <label class="sr-only" for="question">Votre message</label>
          <textarea id="question" rows="1" minlength="2" maxlength="2000" required placeholder="Écrivez votre message…"></textarea>
          <button class="send" id="send" type="submit" aria-label="Envoyer le message" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
          </button>
        </form>
        <div class="composer-note"><span id="status" role="status">À votre écoute</span><label class="speed-control" for="typing-speed">Vitesse d’écriture<select id="typing-speed"><option value="30">Lente</option><option value="60" selected>Normale</option><option value="120">Rapide</option></select></label></div>
      </div>
    </main>
    <footer>Les réponses peuvent contenir des erreurs. Ne partagez aucune information sensible.<br>En mode génération, votre question et les extraits utiles sont transmis à Groq.</footer>
  </div>
  <script>
    const form = document.querySelector('#form');
    const input = document.querySelector('#question');
    const send = document.querySelector('#send');
    const reset = document.querySelector('#reset');
    const messages = document.querySelector('#messages');
    const suggestions = document.querySelector('#suggestions');
    const status = document.querySelector('#status');
    const typingSpeed = document.querySelector('#typing-speed');
    let pending = false;

    function scrollToLatest() { messages.scrollTop = messages.scrollHeight; }

    function resizeInput() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 130) + 'px';
      send.disabled = pending || input.value.trim().length < 2;
    }

    function renderAnswer(element, text, streaming = false) {
      element.replaceChildren();
      // A citation may arrive over several tokens: hide its unfinished suffix too.
      if (streaming) text = text.replace(/(?:\[|【)(?:S[\d\s,;S]*)?$/gi, "");
      // Keep source references out of the chat; never interpret model output as HTML.
      let clean = text.replace(/(?:\[|【)S\d+(?:\s*[,;]\s*S?\d+)*(?:\]|】)/gi, '')
        .replace(/[^\S\n]+([.,;:!?])/g, '$1').replace(/ {2,}/g, ' ').trim();
      if (streaming) {
        if (clean.endsWith('*') && !clean.endsWith('**')) clean = clean.slice(0, -1);
        if ((clean.match(/\*\*/g) || []).length % 2) clean += '**';
      }
      for (const part of clean.split(/(\*\*[^*]*\*\*)/g)) {
        if (part.startsWith('**') && part.endsWith('**')) {
          const strong = document.createElement('strong');
          strong.textContent = part.slice(2, -2);
          element.append(strong);
        } else {
          element.append(document.createTextNode(part));
        }
      }
    }

    function createWriter(bubble, onPaint) {
      // Separate network reception from visible writing. Even a burst of SSE
      // events must take several painted frames, rather than one DOM update.
      const characters = [];
      let shown = 0, frame = 0, previous = null, credit = 0;
      let finished = false, cancelled = false;
      let resolveDrain;
      const drained = new Promise(resolve => { resolveDrain = resolve; });

      function schedule() {
        if (!frame && !cancelled) frame = requestAnimationFrame(paint);
      }

      function paint(now) {
        frame = 0;
        if (cancelled) return;
        const elapsed = previous === null ? 0 : Math.min(now - previous, 50);
        previous = now;
        credit += elapsed * Number(typingSpeed.value) / 1000;
        const count = Math.min(characters.length - shown, Math.floor(credit));
        if (count > 0) {
          shown += count;
          credit -= count;
          const atBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 80;
          renderAnswer(bubble, characters.slice(0, shown).join(''), true);
          onPaint();
          if (atBottom) scrollToLatest();
        }
        if (shown < characters.length) {
          schedule();
        } else {
          previous = null;
          credit = 0;
          if (finished) resolveDrain();
        }
      }

      return {
        append(text) {
          if (cancelled || finished) return;
          characters.push(...Array.from(text));
          schedule();
        },
        finish() {
          finished = true;
          schedule();
          return drained;
        },
        cancel() {
          cancelled = true;
          cancelAnimationFrame(frame);
          resolveDrain();
        }
      };
    }

    function addMessage(role, text, { loading = false, error = false } = {}) {
      const row = document.createElement('div');
      row.className = 'message ' + role + (error ? ' error' : '');
      if (role === 'assistant') {
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = '✦';
        row.append(avatar);
      }
      const content = document.createElement('div');
      content.className = 'message-content';
      const author = document.createElement('span');
      author.className = 'author';
      author.textContent = role === 'user' ? 'Vous' : 'NovaMaison';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (loading) {
        bubble.setAttribute('aria-label', 'NovaMaison prépare sa réponse');
        const dots = document.createElement('div');
        dots.className = 'typing';
        dots.setAttribute('aria-hidden', 'true');
        for (let i = 0; i < 3; i++) dots.append(document.createElement('span'));
        bubble.append(dots);
      } else if (role === 'assistant') {
        renderAnswer(bubble, text);
      } else {
        bubble.textContent = text;
      }
      content.append(author, bubble);
      row.append(content);
      messages.append(row);
      scrollToLatest();
      return row;
    }

    function newDiscussion() {
      if (pending) return;
      messages.replaceChildren();
      addMessage('assistant', 'Bonjour et bienvenue chez NovaMaison ! Comment puis-je vous aider aujourd’hui ?');
      suggestions.hidden = false;
      input.value = '';
      status.textContent = 'À votre écoute';
      resizeInput();
    }

    async function readEventStream(response, onEvent) {
      if (!response.body || !response.headers.get('Content-Type')?.includes('text/event-stream')) {
        throw new Error('stream');
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '', name = 'message', data = [];
      function line(text) {
        if (text === '') {
          if (data.length) onEvent(name, JSON.parse(data.join('\n')));
          name = 'message';
          data = [];
        } else if (text.startsWith('event:')) {
          name = text.slice(6).trim();
        } else if (text.startsWith('data:')) {
          data.push(text.slice(5).replace(/^ /, ''));
        }
      }
      try {
        while (true) {
          const { value, done } = await reader.read();
          buffer += done ? decoder.decode() : decoder.decode(value, { stream: true });
          let end;
          while ((end = buffer.indexOf('\n')) !== -1) {
            line(buffer.slice(0, end).replace(/\r$/, ''));
            buffer = buffer.slice(end + 1);
          }
          if (done) {
            if (buffer) line(buffer.replace(/\r$/, ''));
            line('');
            return;
          }
        }
      } finally {
        await reader.cancel().catch(() => {});
        reader.releaseLock();
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const question = input.value.trim();
      if (pending || question.length < 2 || question.length > 2000) return;
      pending = true;
      reset.disabled = true;
      suggestions.hidden = true;
      addMessage('user', question);
      input.value = '';
      resizeInput();
      const reply = addMessage('assistant', '', { loading: true });
      const bubble = reply.querySelector('.bubble');
      reply.setAttribute('aria-busy', 'true');
      status.textContent = 'NovaMaison prépare sa réponse…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 120000);
      let text = '', mode = 'groq', completed = false;
      const writer = createWriter(bubble, () => {
        reply.classList.add('streaming');
        bubble.removeAttribute('aria-label');
        status.textContent = 'NovaMaison écrit…';
      });
      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
          body: JSON.stringify({ question }), signal: controller.signal
        });
        if (!response.ok) throw new Error('service');
        await readEventStream(response, (name, data) => {
          if (name === 'error') throw new Error('generation');
          if (name === 'start') mode = data.mode;
          if (name === 'token' && mode !== 'extractive') {
            if (completed || typeof data.text !== 'string') throw new Error('protocol');
            text += data.text;
            writer.append(data.text);
          }
          if (name === 'done') {
            if (mode !== 'extractive' && !text.trim()) throw new Error('empty');
            completed = true;
          }
        });
        if (!completed) throw new Error('interrupted');
        clearTimeout(timeout);
        await writer.finish();
        reply.classList.remove('streaming');
        bubble.removeAttribute('aria-label');
        renderAnswer(bubble, mode === 'extractive'
          ? 'Je ne peux pas formuler de réponse pour le moment. Vous pouvez contacter assistance@novamaison.example.'
          : text);
        status.textContent = 'À votre écoute';
      } catch (error) {
        writer.cancel();
        controller.abort();
        reply.classList.remove('streaming');
        reply.classList.add('error');
        bubble.removeAttribute('aria-label');
        renderAnswer(bubble, error.name === 'AbortError'
          ? 'La réponse prend plus de temps que prévu. Vous pouvez réessayer dans un instant.'
          : 'La réponse n’a pas pu être terminée. Réessayez dans un instant ou contactez assistance@novamaison.example.');
        if (!input.value.trim()) input.value = question;
        status.textContent = 'Message non traité · Vous pouvez réessayer';
      } finally {
        writer.cancel();
        clearTimeout(timeout);
        reply.removeAttribute('aria-busy');
        pending = false;
        reset.disabled = false;
        resizeInput();
        input.focus({ preventScroll: true });
      }
    });

    input.addEventListener('input', resizeInput);
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        if (!pending) form.requestSubmit();
      }
    });
    suggestions.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || pending) return;
      input.value = button.textContent;
      form.requestSubmit();
    });
    reset.addEventListener('click', () => { newDiscussion(); input.focus(); });
    newDiscussion();
  </script>
</body>
</html>
