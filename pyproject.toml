[project]
name = "inferpilot"
version = "0.1.0"
description = "Assistant RAG e-commerce multilingue"
requires-python = ">=3.11"
dependencies = ["fastembed>=0.9,<0.10", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "numpy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
