services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GENERATION_MODE: ${GENERATION_MODE:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    volumes:
      - models:/srv/.cache
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
volumes:
  models:
